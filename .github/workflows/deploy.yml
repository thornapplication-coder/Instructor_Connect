name: Instructor Connect auf GitHub Pages veröffentlichen

# Veröffentlicht ausschließlich main. Vorher stand hier zusätzlich ein
# Arbeitszweig — der lag zeitweise 22 Commits vor main, sodass „live" und
# „freigegeben" nichts miteinander zu tun hatten und die Seite beim Löschen
# des Zweigs schlagartig zurückgefallen wäre. Vorschauen laufen über
# workflow_dispatch von Hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Laufende Veröffentlichungen nicht abbrechen – sonst kann eine halb
# hochgeladene Seite zurückbleiben.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Hinweis: Pages lässt sich hier nicht automatisch aktivieren – das
      # Actions-Token darf keine Pages-Site anlegen ("Resource not accessible
      # by integration"). Einmalig unter Settings -> Pages die Quelle auf
      # "GitHub Actions" stellen, danach läuft alles selbsttätig.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # Pruefung und Veroeffentlichung sind getrennte Workflows und laufen
      # unabhaengig voneinander. Ohne diesen Schritt wuerde eine gebrochene
      # Regel zwar den Merge blockieren, aber trotzdem live gehen.
      - name: Tests
        run: |
          npm ci
          npm test

      - name: Build (Sandbox-Modus)
        # Kein AC_BASE: der relative Basispfad aus vite.config.ts funktioniert
        # unter jedem Pages-Pfad, auch nach Repo-Umbenennungen.
        run: |
          npm run build
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
