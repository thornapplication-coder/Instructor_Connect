name: Instructor Connect auf GitHub Pages veröffentlichen

# Veröffentlicht ausschließlich main. Vorher stand hier zusätzlich ein
# Arbeitszweig — der lag zeitweise 22 Commits vor main, sodass „live" und
# „freigegeben" nichts miteinander zu tun hatten und die Seite beim Löschen
# des Zweigs schlagartig zurückgefallen wäre. Vorschauen laufen über
# workflow_dispatch von Hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Laufende Veröffentlichungen nicht abbrechen – sonst kann eine halb
# hochgeladene Seite zurückbleiben.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Hinweis: Pages lässt sich hier nicht automatisch aktivieren – das
      # Actions-Token darf keine Pages-Site anlegen ("Resource not accessible
      # by integration"). Einmalig unter Settings -> Pages die Quelle auf
      # "GitHub Actions" stellen, danach läuft alles selbsttätig.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # Pruefung und Veroeffentlichung sind getrennte Workflows und laufen
      # unabhaengig voneinander. Ohne diesen Schritt wuerde eine gebrochene
      # Regel zwar den Merge blockieren, aber trotzdem live gehen.
      - name: Tests
        run: |
          npm ci
          npm test

      - name: Build (Sandbox-Modus)
        # Kein AC_BASE: der relative Basispfad aus vite.config.ts funktioniert
        # unter jedem Pages-Pfad, auch nach Repo-Umbenennungen.
        run: |
          npm run build
          cp dist/index.html dist/404.html
          # Zweite Absicherung: kein Geheimnis im veröffentlichten Bundle
          # (die erste steckt in vite.config.ts). Gesucht wird nach echten
          # Schlüsselwerten, nicht nach den Prüfmustern im Code.
          if grep -rEl 'sb_secret_[A-Za-z0-9_-]{16,}|sk-ant-[A-Za-z0-9_-]{16,}' dist; then
            echo "Geheimer Schlüssel im Bundle gefunden — Veröffentlichung abgebrochen."
            exit 1
          fi
          # Ein service_role-JWT sieht aus wie der öffentliche anon-Schlüssel;
          # erst die Rolle in der Nutzlast unterscheidet sie (Audit 11/2026,
          # CIG-04). Jede JWT-förmige Zeichenkette wird dekodiert — eine
          # andere Rolle als anon bricht ab. Bewusst eigener Code statt
          # src/backend/konfig.ts: Die zweite Stufe soll nicht mit der
          # ersten zusammen irren.
          grep -rEoh 'eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}' dist | sort -u > "$RUNNER_TEMP/jwt.txt" || true
          node -e '
            const jwt = require("fs").readFileSync(process.argv[1], "utf8").split("\n").filter(Boolean)
            const rolle = (j) => { try { return JSON.parse(Buffer.from(j.split(".")[1], "base64url").toString()).role } catch { return undefined } }
            const geheim = jwt.map(rolle).filter((r) => typeof r === "string" && r !== "anon")
            if (geheim.length) {
              console.error(`JWT mit Rolle ${[...new Set(geheim)].join(", ")} im Bundle gefunden — Veröffentlichung abgebrochen.`)
              process.exit(1)
            }
          ' "$RUNNER_TEMP/jwt.txt"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Ebene 3 auch vor der Veröffentlichung. Bisher lief sie nur in ci.yml —
  # unabhängig von diesem Workflow, beide starten beim Push auf main. Ein
  # roter Browser-Test (etwa ein kaputter Offline-Start, den Ebene 1 und 2
  # nicht sehen) ging damit live, sofern nicht zufällig ein Branch-Schutz
  # den Merge aufhielt (Gegenprüfung L-CI, Audit 11/2026). Eigener Job
  # neben dem Build, damit die Veröffentlichung nicht um seine Laufzeit
  # länger wartet als nötig; `deploy` braucht beide.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Abhängigkeiten und Browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Ebene 3 (Playwright)
        run: npm run e2e

      - name: Bericht bei Fehlern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Nachkontrolle der veröffentlichten Seite (e2e/live.spec.ts). Bis hierher
  # war alles grün, was VOR dem Hochladen geprüft wird — was danach geschah,
  # sah niemand: Pfad unter GitHub Pages, dessen Cache-Lebensdauer (TEC-01
  # entstand genau dort), die Kopfzeilen des Hostings. Der Test wartet, bis
  # die Seite genau DIESEN Build ausliefert (Cache-Name aus einem Build
  # desselben Commits — reproduzierbar, siehe ci.yml), meldet sich an, lässt
  # den Selbsttest der App laufen und startet einmal ohne Netz. Rot heißt:
  # live ist etwas kaputt — die vorige Fassung lässt sich über „Re-run" des
  # letzten grünen Laufs wiederherstellen.
  nachkontrolle:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Abhängigkeiten und Browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Erwarteten Stand bauen
        run: npm run build

      - name: Veröffentlichte Seite prüfen
        env:
          LIVE_URL: ${{ needs.deploy.outputs.url }}
          LIVE_STAND_AUS_DIST: '1'
        run: npm run live

      - name: Bericht bei Fehlern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nachkontrolle-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
